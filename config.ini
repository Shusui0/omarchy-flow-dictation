[transcription]
# local uses whisper.cpp (whisper-cli); openai-compatible sends audio to a configured API.
provider = local
command = whisper-cli
model =
language =

[cloud]
base_url = https://api.openai.com/v1
api_key_env = FLOW_API_KEY
transcription_model = whisper-1
chat_model = gpt-4o-mini

[writing]
polish = true
polish_backend = ollama
ollama_url = http://127.0.0.1:11434/api/chat
ollama_model = qwen2.5:7b
style = casual
confirm_before_insert = false

[audio]
recorder = pw-record

[insertion]
type_command = wtype
